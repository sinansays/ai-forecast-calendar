# Cloudflare Workers Builds watches this repository and deploys merges to main.
# The corresponding Cloudflare Build configuration is:
#   Build command:   npm run build
#   Deploy command:  npx wrangler deploy
#   Version command: npx wrangler versions upload
#
# This workflow deliberately does not deploy. It verifies, using the same Node
# version and build command, that the revision Cloudflare receives can build.
name: Verify Cloudflare deployment build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Cloudflare Workers assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Cloudflare build command
        run: npm run build
      - name: Verify Cloudflare deploy and version configuration
        run: |
          npx wrangler deploy --dry-run
          npx wrangler versions upload --dry-run
